name: Bug Report
description: Report an issue or bug with go-satim
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide the following details to help resolve the issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen?
      placeholder: Description of the bug and unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce the bug
      description: Steps or minimal reproducible Go code snippet.
      placeholder: Minimal code reproducing the issue.
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Output of `go version`
      placeholder: go version go1.27.0 darwin/arm64
    validations:
      required: true
  - type: dropdown
    id: operating-systems
    attributes:
      label: Operating System
      multiple: true
      options:
        - macOS
        - Linux
        - Windows
  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Any other context or log outputs (with secrets redacted).
    validations:
      required: false
